name: Web Pages

on:
  push:
    branches: [rebuild/v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate project structure
        run: |
          test -d web
          test -d android
          test -d shared
          test -f web/README.md
