name: Android Build

on:
  push:
    branches: [rebuild/v2]
    paths: ['android/**']
  pull_request:
    branches: [rebuild/v2]
    paths: ['android/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        run: gradle assembleDebug
